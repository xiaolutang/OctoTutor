# OctoTutor 生产部署配置
# 使用方式: ./deploy/deploy.sh remote
#
# 特点:
#   - 依赖外部 Traefik 网关（gateway 网络）
#   - IP 直连 + PathPrefix 路由（HTTP + HTTPS 自签名证书）
#   - 需要远端已部署基础设施（Traefik + auth-center）
#   - 前端 catch-all + 后端 /api/* 路由

services:
  octotutor-frontend:
    image: octotutor-frontend:latest
    container_name: octotutor-frontend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - AUTH_CLIENT_ID=${AUTH_CLIENT_ID}
      - AUTH_BASE_URL=${AUTH_BASE_URL}
    networks:
      - gateway
      - auth-network
    labels:
      - "traefik.enable=true"
      # HTTP 路由
      - "traefik.http.routers.octotutor-frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.octotutor-frontend.entrypoints=web"
      - "traefik.http.routers.octotutor-frontend.priority=1"
      - "traefik.http.routers.octotutor-frontend.service=octotutor-frontend-svc"
      # HTTPS 路由（Traefik 默认自签名证书）
      - "traefik.http.routers.octotutor-frontend-secure.rule=PathPrefix(`/`)"
      - "traefik.http.routers.octotutor-frontend-secure.entrypoints=websecure"
      - "traefik.http.routers.octotutor-frontend-secure.priority=1"
      - "traefik.http.routers.octotutor-frontend-secure.tls=true"
      - "traefik.http.routers.octotutor-frontend-secure.service=octotutor-frontend-svc"
      - "traefik.http.services.octotutor-frontend-svc.loadbalancer.server.port=3000"
    deploy:
      resources:
        limits:
          memory: 512M

  octotutor-backend:
    image: octotutor-backend:latest
    container_name: octotutor-backend
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - NEWAPI_API_KEY=${NEWAPI_API_KEY}
      - NEWAPI_BASE_URL=http://new-api:3000/v1
      - AUTH_CLIENT_ID=${AUTH_CLIENT_ID}
      - AUTH_BASE_URL=${AUTH_BASE_URL}
      - DATABASE_URL=postgresql://octotutor:octotutor2024@auth-center-postgres:5432/octotutor_checkpoints
      - CHROMA_PERSIST_DIR=/app/data/chroma_db
      - IMAGE_MAX_STORAGE_MB=${IMAGE_MAX_STORAGE_MB:-1000}
    volumes:
      - octotutor-data:/app/data
    networks:
      - gateway
      - auth-network
      - new-api-net
    labels:
      - "traefik.enable=true"
      # HTTP 路由
      - "traefik.http.routers.octotutor-backend.rule=PathPrefix(`/api/`)"
      - "traefik.http.routers.octotutor-backend.entrypoints=web"
      - "traefik.http.routers.octotutor-backend.priority=10"
      - "traefik.http.routers.octotutor-backend.service=octotutor-backend-svc"
      # HTTPS 路由（Traefik 默认自签名证书）
      - "traefik.http.routers.octotutor-backend-secure.rule=PathPrefix(`/api/`)"
      - "traefik.http.routers.octotutor-backend-secure.entrypoints=websecure"
      - "traefik.http.routers.octotutor-backend-secure.priority=10"
      - "traefik.http.routers.octotutor-backend-secure.tls=true"
      - "traefik.http.routers.octotutor-backend-secure.service=octotutor-backend-svc"
      - "traefik.http.services.octotutor-backend-svc.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1024M

volumes:
  octotutor-data:
    name: octotutor-data

networks:
  gateway:
    external: true
  auth-network:
    external: true
  new-api-net:
    external: true
    name: new-api_default
