# OctoTutor 生产部署配置
# 使用方式: ./deploy/deploy.sh remote
#
# 特点:
#   - 依赖外部 Traefik 网关（gateway 网络）
#   - 通过 Traefik labels 配置 TLS + 域名路由
#   - 需要远端已部署基础设施（Traefik + auth-center）

services:
  octotutor:
    image: octotutor:latest
    container_name: octotutor
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - AUTH_CLIENT_ID=${AUTH_CLIENT_ID}
      - AUTH_BASE_URL=${AUTH_BASE_URL}
    networks:
      - gateway
      - auth-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.octotutor.rule=Host(`${OCTOTUTOR_DOMAIN:-octotutor.xiaolutang.top}`)"
      - "traefik.http.routers.octotutor.entrypoints=websecure"
      - "traefik.http.routers.octotutor.tls=true"
      - "traefik.http.routers.octotutor.tls.certresolver=ali"
      - "traefik.http.routers.octotutor.service=octotutor-svc"
      - "traefik.http.services.octotutor-svc.loadbalancer.server.port=3000"

networks:
  gateway:
    external: true
  auth-network:
    external: true
