# OctoTutor 本地部署配置
# 使用方式: ./deploy/deploy.sh local
#
# 特点:
#   - 加入 xlfoundryTest 已有的 auth-network-local 网络，复用 Traefik + auth-center
#   - OctoTutor 通过 Traefik 路由，域名 octotutor.localhost
#   - 前端 catch-all + 后端 /api/* 路由
#   - 需要先启动 xlfoundryTest 的 auth-center 服务
#
# 路由规则（Traefik priority）:
#   /api/*  → octotutor-backend (priority=10)
#   /*      → octotutor-frontend (priority=1)
#   ⚠️ 因此所有 /api/* 接口必须由后端提供，前端的 Next.js route handler 不会被调用

services:
  octotutor-frontend:
    image: octotutor-frontend:latest
    container_name: octotutor-frontend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - ENABLE_DEV_SANDBOX=true
      - AUTH_CLIENT_ID=${AUTH_CLIENT_ID:-MlP4hO8DKk-BOByD}
      - AUTH_BASE_URL=${AUTH_BASE_URL:-http://auth.localhost}
    networks:
      - auth-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.octotutor-frontend-local.rule=Host(`octotutor.localhost`)"
      - "traefik.http.routers.octotutor-frontend-local.entrypoints=web"
      - "traefik.http.routers.octotutor-frontend-local.priority=1"
      - "traefik.http.routers.octotutor-frontend-local.service=octotutor-frontend-local-svc"
      - "traefik.http.services.octotutor-frontend-local-svc.loadbalancer.server.port=3000"

  octotutor-backend:
    image: octotutor-backend:latest
    container_name: octotutor-backend
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-sk-c7515920ba8849e087aeaac9353c8580}
      - NEWAPI_API_KEY=${NEWAPI_API_KEY:-sk-wF0sdr5RXRWukmmw6LrGwFgDFm8JbmfnrK5dmXqKZMARcy8I}
      - NEWAPI_BASE_URL=http://host.docker.internal:13000/v1
      - LLM_MODEL=${LLM_MODEL:-glm-5.1}
      - CHROMA_PERSIST_DIR=/app/data/chroma_db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - DATABASE_URL=postgresql://postgres:postgres@auth-center-postgres:5432/octotutor_checkpoints
      - AUTH_CLIENT_ID=${AUTH_CLIENT_ID:-MlP4hO8DKk-BOByD}
      - AUTH_BASE_URL=${AUTH_BASE_URL:-http://auth.localhost}
    volumes:
      - octotutor-data:/app/data
    networks:
      - auth-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.octotutor-backend-local.rule=Host(`octotutor.localhost`) && PathPrefix(`/api/`)"
      - "traefik.http.routers.octotutor-backend-local.entrypoints=web"
      - "traefik.http.routers.octotutor-backend-local.priority=10"
      - "traefik.http.routers.octotutor-backend-local.service=octotutor-backend-local-svc"
      - "traefik.http.services.octotutor-backend-local-svc.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  octotutor-data:
    name: octotutor-data-local

networks:
  auth-network:
    name: auth-network-local
    external: true
